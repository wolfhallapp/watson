<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Wolf Hall TV</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="rain.js" defer></script>
<style>
  /* The house TV (11/23). Seen from across the room: everything is sized in vw/vh, nothing private, no money. */
  :root { --g: #33ff88; --g2: #19c964; --dim: #0b6b39; --bg: #000; --txt: #d9ffe8; --gold: #ffd36b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); overflow: hidden; cursor: none;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .28; }
  .tv { position: relative; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 3vh 3.5vw; gap: 2.5vh; }
  header { display: flex; justify-content: space-between; align-items: flex-end; }
  .clock { font-size: 11vw; line-height: .9; font-weight: 200; color: #fff; letter-spacing: -.02em; text-shadow: 0 0 2vw rgba(51,255,136,.35); }
  .clock small { font-size: .32em; color: var(--g); margin-left: .4vw; font-weight: 300; }
  .date { font-size: 2.4vw; color: var(--g); margin-top: 1vh; letter-spacing: .08em; text-transform: uppercase; }
  .wx { text-align: right; max-width: 42vw; }
  .wx .now { font-size: 3vw; color: #fff; }
  .wx .wk { font-size: 1.5vw; color: var(--g2); margin-top: .8vh; }
  main { position: relative; }
  .card { position: absolute; inset: 0; background: rgba(0,12,6,.78); border: 1px solid var(--dim); border-radius: 1.6vw;
    padding: 3.5vh 3vw; opacity: 0; transform: translateY(2vh); transition: opacity 1.1s, transform 1.1s; overflow: hidden;
    box-shadow: 0 0 4vw rgba(51,255,136,.08) inset; }
  .card.on { opacity: 1; transform: none; }
  .card h2 { margin: 0 0 2.5vh; font-size: 1.7vw; letter-spacing: .35em; color: var(--g); font-weight: 600; text-transform: uppercase; }
  .big { font-size: 3.6vw; color: #fff; line-height: 1.25; }
  ul.lines { list-style: none; margin: 0; padding: 0; }
  ul.lines li { font-size: 2.6vw; line-height: 1.35; padding: 1.2vh 0; border-bottom: 1px solid rgba(51,255,136,.15); }
  ul.lines li:last-child { border-bottom: 0; }
  ul.lines li b { color: var(--g); font-weight: 600; margin-right: 1vw; }
  .cd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vw; }
  .cd > div { text-align: center; background: rgba(51,255,136,.06); border-radius: 1.2vw; padding: 3vh 1vw; }
  .cd .n { font-size: 6vw; color: #fff; font-weight: 200; line-height: 1; }
  .cd .u { font-size: 1.3vw; color: var(--g2); letter-spacing: .2em; }
  .cd .w { font-size: 1.8vw; margin-top: 1.5vh; }
  .verse { font-size: 3.4vw; line-height: 1.35; color: #fff; font-style: italic; max-width: 80vw; }
  .verse cite { display: block; font-size: 1.8vw; color: var(--gold); font-style: normal; margin-top: 2.5vh; letter-spacing: .1em; }
  .trip .n { font-size: 9vw; color: #fff; font-weight: 200; }
  .warn { color: #ffb36b; }
  footer { display: flex; justify-content: space-between; font-size: 1.2vw; color: var(--dim); letter-spacing: .3em; text-transform: uppercase; }
  .dots i { display: inline-block; width: .7vw; height: .7vw; border-radius: 50%; background: var(--dim); margin-left: .6vw; }
  .dots i.on { background: var(--g); }
  /* Boot screen */
  #boot { position: fixed; inset: 0; background: #000; z-index: 9; display: flex; align-items: center; justify-content: center; transition: opacity 1.2s; }
  #boot pre { font: 2.4vw/1.6 "Cascadia Mono", Consolas, monospace; color: var(--g); white-space: pre-wrap; margin: 0; min-width: 50vw; text-shadow: 0 0 1vw rgba(51,255,136,.6); }
  #boot.gone { opacity: 0; pointer-events: none; }
  .cursor { display: inline-block; width: .6em; background: var(--g); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; background: #000; cursor: auto; }
  .login[hidden] { display: none; }
  .login form { font-size: 1.4vw; color: var(--g); display: grid; gap: 1.5vh; width: 40vw; }
  .login input, .login button { font: inherit; padding: 1vh 1vw; background: #001a0c; color: #fff; border: 1px solid var(--g2); border-radius: .5vw; }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="boot"><pre id="bootText"></pre></div>
<div class="tv">
  <header>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    <div class="wx"><div class="now" id="wx"></div><div class="wk" id="wk"></div></div>
  </header>
  <main id="cards"></main>
  <footer><span>Wolf Hall</span><span class="dots" id="dots"></span></footer>
</div>
<div class="login" id="login" hidden><form id="lf"><b>Wolf Hall TV</b><span>Paste the Oracle's access token once (WATSON_TOKEN). It stays on this PC.</span><input id="tok" type="password" autocomplete="off"><button>Connect</button></form></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let token = ''; try { token = JSON.parse(localStorage.getItem('watson.token') || '""'); } catch (e) { /* */ }
  const hashTok = new URLSearchParams(location.hash.slice(1)).get('token');
  if (hashTok) { token = hashTok; try { localStorage.setItem('watson.token', JSON.stringify(token)); } catch (e) { /* */ } history.replaceState(null, '', location.pathname); }
  $('lf').onsubmit = (e) => { e.preventDefault(); token = $('tok').value.trim(); try { localStorage.setItem('watson.token', JSON.stringify(token)); } catch (er) { /* */ } $('login').hidden = true; load(); };

  // Clock
  function tick() {
    const d = new Date();
    let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    $('clock').innerHTML = h + ':' + String(d.getMinutes()).padStart(2, '0') + '<small>' + ap + '</small>';
    $('date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 1000);

  // Boot screen: a short Matrix-style start each time the TV page opens.
  const bootLines = ['> jacking in to wolf hall...', '> signal found: the house', '> the oracle is watching over the kitchen', '> welcome home.'];
  (function boot() {
    let i = 0, j = 0, out = '';
    const step = () => {
      if (i >= bootLines.length) { setTimeout(() => $('boot').classList.add('gone'), 900); return; }
      if (j <= bootLines[i].length) { $('bootText').innerHTML = esc(out + bootLines[i].slice(0, j)) + '<span class="cursor">&nbsp;</span>'; j++; setTimeout(step, 45); }
      else { out += bootLines[i] + '\n'; i++; j = 0; setTimeout(step, 350); }
    };
    step();
  })();

  // Cards rotate every 20 seconds.
  let cards = [], idx = 0, timer = null;
  function show(n) {
    const els = $('cards').children; if (!els.length) return;
    idx = (n + els.length) % els.length;
    [...els].forEach((c, i) => c.classList.toggle('on', i === idx));
    $('dots').innerHTML = [...els].map((_, i) => '<i class="' + (i === idx ? 'on' : '') + '"></i>').join('');
  }
  function daysLabel(n) { return n === 0 ? 'TODAY' : n === 1 ? 'DAY' : 'DAYS'; }
  function render(s) {
    $('wx').textContent = s.weather || '';
    $('wk').textContent = (s.week || '').replace(/^Weather:\s*/i, '');
    cards = [];
    const today = (s.today || []).concat(s.weekLines || []).slice(0, 6);
    if (today.length) cards.push('<h2>Around the house</h2><ul class="lines">' + today.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>');
    if (s.trip) {
      const t = s.trip, target = new Date(t.phase === 'before' ? t.leave : t.back), days = Math.max(0, Math.ceil((target - new Date()) / 86400000));
      cards.push('<h2>' + (t.phase === 'before' ? 'Road trip to Hugo' : 'Back home') + '</h2><div class="trip"><span class="n">' + days + '</span> <span class="big">' + (days === 1 ? 'day' : 'days') + (t.phase === 'before' ? ' until we leave' : ' until we\'re home') + '</span></div>'
        + (t.freezes && t.freezes.length ? '<ul class="lines">' + t.freezes.map((f) => '<li class="warn">❄️ ' + esc(f) + '</li>').join('') + '</ul>' : ''));
    }
    if (s.countdowns && s.countdowns.length) cards.push('<h2>Coming up</h2><div class="cd">' + s.countdowns.slice(0, 4).map((c) => '<div><div class="n">' + (c.days === 0 ? '🎉' : c.days) + '</div><div class="u">' + daysLabel(c.days) + '</div><div class="w">' + esc(c.icon + ' ' + c.name) + '</div></div>').join('') + '</div>');
    if (s.church && s.church.length) cards.push('<h2>Church this week</h2><ul class="lines">' + s.church.map((c) => '<li><b>' + esc(c.when) + ' · ' + esc(c.time) + '</b>' + esc(c.what) + '</li>').join('') + '</ul>');
    if (s.verse) cards.push('<h2>Verse of the day</h2><div class="verse">“' + esc(s.verse.text) + '”<cite>' + esc(s.verse.ref) + ' (ESV)</cite></div>');
    $('cards').innerHTML = cards.map((c) => '<section class="card">' + c + '</section>').join('');
    show(idx);
  }
  async function load() {
    if (!token) { $('login').hidden = false; return; }
    try {
      const r = await fetch('tv/state', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' });
      if (r.status === 401) { $('login').hidden = false; return; }
      if (r.ok) render(await r.json());
    } catch (e) { /* the PC's server is restarting; keep the last screen */ }
  }
  load();
  setInterval(load, 5 * 60000);
  if (!timer) timer = setInterval(() => show(idx + 1), 20000);
  setTimeout(() => location.reload(), 6 * 3600000); // a fresh start every 6 hours
  document.addEventListener('dblclick', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); });
})();
</script>
</body>
</html>
